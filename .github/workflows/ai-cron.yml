name: Autonomous AI Daily Content Engine

on:
  schedule:
    # Run at 00:15 UTC every day (5:45 AM Nepal Time)
    - cron: '15 0 * * *'
  workflow_dispatch: # Allow manual triggers from the GitHub UI

jobs:
  trigger-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Autonomous AI Brain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ secrets.PRODUCTION_URL }}/api/admin/autonomous
        run: |
          echo "Triggering Autonomous AI Content Engine..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$API_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300)
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d ':' -f 2)
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "AI content engine failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "AI content engine completed successfully!"
          echo "Generated: $(echo $BODY | python3 -c 'import sys,json; d=json.load(sys.stdin); print(f\"Article: {d.get(\"article\",{}).get(\"title\",\"N/A\")} | Research: {d.get(\"research\",{}).get(\"title\",\"N/A\")}\")')"
