name: Autonomous AI Daily Content Engine

on:
  schedule:
    # Run at 00:15 UTC every day (5:45 AM Nepal Time)
    - cron: '15 0 * * *'
  workflow_dispatch: # Allow manual triggers from the GitHub UI

jobs:
  trigger-ai-content:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Autonomous AI Brain
        env:
          RAW_PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          RAW_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Preparing Autonomous AI Content Engine Trigger..."
          
          # Fallback defaults if secrets are empty (use canonical www domain)
          BASE_URL="${RAW_PRODUCTION_URL:-https://www.nabarajkc.com.np}"
          BASE_URL="${BASE_URL%/}"
          SECRET="${RAW_CRON_SECRET:-nkc-cron-secret-2026}"
          API_URL="${BASE_URL}/api/admin/autonomous?async=true"
          
          echo "Target API Endpoint: $API_URL"
          
          RESPONSE=$(curl -sSL --location-trusted -w "\nHTTP_STATUS:%{http_code}" -X GET "$API_URL" \
            -H "Authorization: Bearer $SECRET" \
            --max-time 300)
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d ':' -f 2)
          BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::AI Content Engine failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          
          echo "AI Content Engine completed successfully!"
