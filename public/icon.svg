<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium amber/orange gradient matching Nabaraj KC branding -->
    <linearGradient id="nkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28A37"/>
      <stop offset="50%" stop-color="#C85A17"/>
      <stop offset="100%" stop-color="#9E3F05"/>
    </linearGradient>
    <!-- Soft glow effect for visibility on dark and light browser tabs -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Scaled 1.25x centered at (128,128) for maximum visibility in browser tabs -->
  <g filter="url(#subtleGlow)" transform="translate(128, 128) scale(1.25) translate(-128, -128)">
    <!-- Elegant Calligraphic 'NK' Intertwined Monogram Paths -->
    <path d="M 45 180 C 25 160 32 128 58 122 C 85 116 102 158 82 178 C 68 192 45 182 50 162 C 60 122 110 60 142 48 C 162 40 180 50 166 74 C 146 104 108 158 84 196 C 74 210 64 200 74 180 C 94 140 138 72 172 52" 
          stroke="url(#nkGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 122 135 C 142 115 170 90 194 80 C 214 70 228 84 208 104 C 184 128 150 144 136 154 C 154 164 188 184 218 188 C 228 189 224 198 208 198 C 184 198 155 174 138 158" 
          stroke="url(#nkGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle AI Tech Sparkle Accent -->
    <circle cx="210" cy="60" r="5" fill="#E28A37"/>
    <path d="M 210 48 L 210 72 M 198 60 L 222 60" stroke="#E28A37" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
